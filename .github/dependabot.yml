# .github/dependabot.yml
# Bitcoin Intel — IRP v1 Wave 3 / OP04 (2026-07-01)
#
# Экосистемы в проекте на 2026-07-01 (проверено, не шаблон "на всякий случай"):
#   - pip: requirements.txt в корне репозитория. pyproject.toml не объявляет
#     зависимостей ([tool.flake8]/[tool.black]/[tool.pytest] — конфиги, не
#     dependency manifest), поэтому pip-экосистема указывает на "/".
#   - github-actions: .github/workflows/deploy.yml использует
#     actions/checkout@v4, actions/setup-python@v5, actions/configure-pages@v4,
#     actions/upload-pages-artifact@v3, actions/deploy-pages@v4.
#   - npm/yarn/etc НЕ настроены — в репозитории нет package.json.
#
# target-branch: main, не develop (изменено 2026-08-09). Изначально (2026-07-01)
# был настроен develop — по модели M04 (feature -> develop -> main,
# DEPLOYMENT.md), с отдельным promotion PR develop -> main. На практике с
# 2026-07-04 (последний promotion PR, #116) вся реальная работа идёт прямо
# в main — develop отстала на 600+ коммитов и promotion больше не
# происходит. Dependabot молча копил PR в мёртвую ветку, откуда они никогда
# не попадали в прод. Конфиг приведён в соответствие с фактической практикой
# (trunk-based на main), а не с документом, который перестал отражать
# реальность. Судьба самой ветки develop и обновление DEPLOYMENT.md —
# отдельное решение, не в рамках этой правки. PR от Dependabot по-прежнему
# проходит тот же Branch Protection ("Validate and Test" required status
# check), что и main для любого другого PR.
#
# Обновления версий (Dependabot version updates) — это НЕ замена
# pip-audit в deploy.yml (сканирование известных CVE в текущих
# зафиксированных версиях, работает независимо от того, вышла ли новая
# версия). Dependabot закрывает другую часть DEV10: устаревание версий
# само по себе, не только уязвимости.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
